apiVersion: v1
kind: List
items:
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: users-api
    namespace: fiap-cloud-games
  spec:
    replicas: 2
    minReadySeconds: 5
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    selector:
      matchLabels:
        app: users-api
    template:
      metadata:
        labels:
          app: users-api
      spec:
        containers:
        - name: users-api
          image: fiap-users-api:fase3
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
          env:
          - name: Database__Provider
            value: PostgreSQL
          - name: ConnectionStrings__Db
            valueFrom:
              secretKeyRef:
                name: fcg-secrets
                key: USERS_DB_CONNECTION
          envFrom:
          - configMapRef:
              name: fcg-config
          - secretRef:
              name: fcg-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
- apiVersion: v1
  kind: Service
  metadata:
    name: users-api
    namespace: fiap-cloud-games
  spec:
    selector:
      app: users-api
    ports:
    - name: port-0
      port: 8080
      targetPort: 8080
    type: ClusterIP
