apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
  namespace: fiap-cloud-games
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
    spec:
      containers:
        - name: notifications-api
          image: fiap-notifications-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fiap-cloud-games-config
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-api
  namespace: fiap-cloud-games
spec:
  selector:
    app: notifications-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30004
  type: NodePort
