kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8000
        listenAddress: "127.0.0.1"
      - containerPort: 30300
        hostPort: 3000
        listenAddress: "127.0.0.1"
      - containerPort: 30090
        hostPort: 9090
        listenAddress: "127.0.0.1"
      - containerPort: 31672
        hostPort: 15672
        listenAddress: "127.0.0.1"
