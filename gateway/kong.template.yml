_format_version: "3.0"
_transform: true
consumers:
  - username: fcg-auth
    jwt_secrets:
      - key: FiapCloudGames
        algorithm: HS256
        secret: "__JWT_KEY__"
services:
  - name: users
    url: http://users-api:8080
    routes:
      - name: signup
        paths: ["~/api/users$"]
        methods: ["POST"]
        strip_path: false
      - name: login
        paths: ["~/api/auth/login$"]
        methods: ["POST"]
        strip_path: false
      - name: users-protected
        paths: ["/api/users"]
        methods: ["GET"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: ["exp"]
              uri_param_names: []
              cookie_names: []
  - name: catalog
    url: http://catalog-api:8080
    routes:
      - name: catalog-protected
        paths: ["/api/games", "/api/promotions", "/api/library", "/api/orders"]
        strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify: ["exp"]
          uri_param_names: []
          cookie_names: []
plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid
      echo_downstream: true
