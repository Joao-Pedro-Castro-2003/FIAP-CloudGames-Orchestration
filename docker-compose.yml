services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: fiap-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  users-api:
    build:
      context: ../FIAP-UsersAPI
      dockerfile: Dockerfile
    container_name: fiap-users-api
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Db: Data Source=/app/data/users.db
      RabbitMq__Host: rabbitmq
      Jwt__Key: ${JWT_KEY:-FIAP-TechChallenge-chave-local-dev-com-pelo-menos-32-caracteres}
      Jwt__Issuer: ${JWT_ISSUER:-FiapCloudGames}
      Jwt__Audience: ${JWT_AUDIENCE:-FiapCloudGamesUsers}
    ports:
      - "5001:8080"
    volumes:
      - users-data:/app/data

  catalog-api:
    build:
      context: ../FIAP-CatalogAPI
      dockerfile: Dockerfile
    container_name: fiap-catalog-api
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Db: Data Source=/app/data/catalog.db
      RabbitMq__Host: rabbitmq
      Jwt__Key: ${JWT_KEY:-FIAP-TechChallenge-chave-local-dev-com-pelo-menos-32-caracteres}
      Jwt__Issuer: ${JWT_ISSUER:-FiapCloudGames}
      Jwt__Audience: ${JWT_AUDIENCE:-FiapCloudGamesUsers}
    ports:
      - "5002:8080"
    volumes:
      - catalog-data:/app/data

  payments-api:
    build:
      context: ../FIAP-PaymentsAPI
      dockerfile: Dockerfile
    container_name: fiap-payments-api
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      Payment__ApprovalRate: ${PAYMENT_APPROVAL_RATE:-90}
    ports:
      - "5003:8080"

  notifications-api:
    build:
      context: ../FIAP-NotificationsAPI
      dockerfile: Dockerfile
    container_name: fiap-notifications-api
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
    ports:
      - "5004:8080"

volumes:
  users-data:
  catalog-data:
